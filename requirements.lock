# Fully-frozen dependency set for the Docker/Apptainer image.
#
# Generated from the project venv (Python 3.12.7) with:
#     python -m pip freeze > requirements.lock
#
# requirements.txt stays the human-readable statement of intent (7 direct deps);
# this file is what the image installs, so transitive pins (numpy, pillow,
# certifi, ...) are reproduced exactly rather than re-resolved at build time.
# Regenerate whenever requirements.txt changes.
#
# One hand edit after freezing: pyreadline3 is a Windows-only dependency of
# humanfriendly (pulled in by snakemake), so it carries a platform marker to
# keep it out of the Linux image.

